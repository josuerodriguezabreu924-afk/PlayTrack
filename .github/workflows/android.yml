name: Build PlayTrack APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PlayTrack_Android_v3.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract PlayTrack project
        run: unzip PlayTrack_Android_v3.zip -d source

      - name: Build APK
        working-directory: source/PlayTrack_v3_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTrack-debug-apk
          path: source/PlayTrack_v3_Android/app/build/outputs/apk/debug/app-debug.apk
